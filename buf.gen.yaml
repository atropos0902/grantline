version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: grantline/gen
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen
    opt: paths=source_relative
  - local: [node, console/node_modules/@bufbuild/protoc-gen-es/bin/protoc-gen-es]
    out: console/src/gen
    opt: target=ts
  - local: [node, console/node_modules/@connectrpc/protoc-gen-connect-query/bin/protoc-gen-connect-query]
    out: console/src/gen
    opt: target=ts
