[project]
name = "grantline-check"
version = "0.1.0"
description = "Compares a replicated table with its source while both are in use"
requires-python = ">=3.14"
dependencies = ["psycopg[binary]==3.3.4"]

[dependency-groups]
dev = ["pytest==9.0.3", "hypothesis==6.152.4"]

[project.scripts]
grantline-check = "grantline_check.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grantline_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
