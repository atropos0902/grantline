{{- if .Values.console.enabled }}
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}-console}
spec:
  selector: {app.kubernetes.io/name: grantline-console}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-console
  labels: {app.kubernetes.io/name: grantline-console}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: grantline-console}}
  template:
    metadata: {labels: {app.kubernetes.io/name: grantline-console}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: console
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          args:
            - serve
            - -console=/console
            - -nats={{ .Values.nats }}
            {{- range .Values.console.replications }}
            - -worker={{ . }}=http://grantline-{{ . }}:7400
            {{- end }}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
