apiVersion: v1
kind: ServiceAccount
metadata: {name: {{ .Release.Name }}-operator}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: {{ .Release.Name }}-operator}
rules:
  - {apiGroups: [grantline.dev], resources: [replications], verbs: [get, list, watch]}
  - {apiGroups: [grantline.dev], resources: [replications/status], verbs: [get, patch, update]}
  - {apiGroups: [grantline.dev], resources: [replications/finalizers], verbs: [update]}
  - {apiGroups: [apps], resources: [deployments], verbs: [get, list, watch, create, update, patch]}
  - {apiGroups: [""], resources: [configmaps, services, serviceaccounts], verbs: [get, list, watch, create, update, patch]}
  - {apiGroups: [""], resources: [pods], verbs: [get, list, watch]}
  - {apiGroups: [""], resources: [events], verbs: [create, patch]}
  - {apiGroups: [rbac.authorization.k8s.io], resources: [roles, rolebindings], verbs: [get, list, watch, create, update, patch]}
  # Also what the operator hands on to the workers' roles.
  - {apiGroups: [coordination.k8s.io], resources: [leases], verbs: [get, list, watch, create, update, patch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: {{ .Release.Name }}-operator}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ .Release.Name }}-operator}
subjects:
  - {kind: ServiceAccount, name: {{ .Release.Name }}-operator, namespace: {{ .Release.Namespace }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-operator
  labels: {app.kubernetes.io/name: grantline-operator}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: grantline-operator}}
  template:
    metadata: {labels: {app.kubernetes.io/name: grantline-operator}}
    spec:
      serviceAccountName: {{ .Release.Name }}-operator
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: operator
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          command: [/usr/local/bin/operator]
          args:
            - -worker-image={{ .Values.image }}
            - -nats={{ .Values.nats }}
          env:
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
          livenessProbe: {httpGet: {path: /healthz, port: 8081}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{- toYaml .Values.resources | nindent 12 }}
