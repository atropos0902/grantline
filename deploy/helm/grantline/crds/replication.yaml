apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: replications.grantline.dev
spec:
  group: grantline.dev
  names: {kind: Replication, listKind: ReplicationList, plural: replications, singular: replication, shortNames: [repl]}
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Lag, type: string, jsonPath: .status.lag}
        - {name: Worker, type: string, jsonPath: .status.worker}
        - {name: Ready, type: string, jsonPath: '.status.conditions[?(@.type=="Ready")].reason'}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [source, target]
              properties:
                source:
                  type: object
                  required: [dsn, publication]
                  properties:
                    dsn:
                      type: object
                      required: [name, key]
                      properties: {name: {type: string}, key: {type: string}}
                    publication: {type: string, minLength: 1}
                target:
                  type: object
                  required: [kind]
                  properties:
                    kind: {type: string, enum: [postgres, kafka]}
                    dsn:
                      type: object
                      required: [name, key]
                      properties: {name: {type: string}, key: {type: string}}
                    brokers: {type: array, items: {type: string}}
                    prefix: {type: string}
                    replicas: {type: integer, minimum: 1}
                    partitions: {type: integer, minimum: 1}
                    lanes: {type: integer, minimum: 1, maximum: 32}
                  x-kubernetes-validations:
                    - {rule: "self.kind != 'postgres' || has(self.dsn)", message: a postgres target needs dsn}
                    - {rule: "self.kind != 'kafka' || (has(self.brokers) && size(self.brokers) > 0)", message: a kafka target needs brokers}
                paused: {type: boolean}
                chunkRows: {type: integer, minimum: 1}
                copiers: {type: integer, minimum: 1, maximum: 16}
                budgetMiB: {type: integer, minimum: 1}
                workers: {type: integer, minimum: 0, maximum: 5}
                resources: {type: object, x-kubernetes-preserve-unknown-fields: true}
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}
